[package]
name = "rungst-momentum-example"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
base64 = "0.22"
bincode = "1.3.3"
bs58 = "0.5"
dotenvy = "0.15"
ed25519-dalek = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
solana-address = { version = "2", features = ["curve25519"] }
solana-message = { version = "=3.1.0", features = ["bincode"] }
solana-transaction = { version = "=3.1.0", features = ["bincode"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
